name: Node.js SCA Check on CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    # Step 1: Pulls your code into the runner
    - uses: actions/checkout@v4

    # Step 2: Sets up the Node.js environment
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    # Step 3: Installs dependencies based exactly on package-lock.json
    - name: Install Dependencies
      run: npm ci

    # Step 4: Runs standard application tests (requires a test script in package.json)
    - name: Run Tests
      run: npm test --if-present

    # Step 5: DevSecOps baseline - Checks for vulnerable third-party packages
    - name: Run Security Audit
      run: npm audit --audit-level=high
